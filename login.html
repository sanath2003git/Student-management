<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4b6cb7, #182848);
    }

    .login-container {
      background: #fff;
      padding: 40px 35px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 380px;
    }

    .login-container h1 {
      text-align: center;
      color: #182848;
      margin-bottom: 6px;
      font-size: 22px;
    }

    .login-container p.subtitle {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #333;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #4b6cb7;
    }

    .error-message {
      color: #d93025;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .login-options a {
      color: #4b6cb7;
      text-decoration: none;
    }

    .login-options a:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 11px;
      background: #182848;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background: #4b6cb7;
    }

    .signup-link {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #555;
    }

    .signup-link a {
      color: #4b6cb7;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1>Student Management System</h1>
    <p class="subtitle">Sign in to your account</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
        <span class="error-message" id="usernameError">Please enter your username or email.</span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <span class="error-message" id="passwordError">Please enter your password.</span>
      </div>

      <div class="login-options">
        <label><input type="checkbox" id="remember" name="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login">Login</button>
    </form>

    <p class="signup-link">Don't have an account? <a href="#">Sign up</a></p>
  </div>

  <script src="login.js"></script>
</body>
</html>
